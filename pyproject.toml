[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenFoldPanel"
version = "0.1.0"
description = "Local open-source OpenFoldPanel flat representation panel reproduction tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "biopython>=1.83",
  "cairosvg>=2.7.1",
  "gemmi>=0.6.7",
  "svgwrite>=1.4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openfoldpanel.UI" = [
  "report.template.html",
  "fonts/*.ttf",
  "styles/*.css",
  "scripts/*.js",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]
